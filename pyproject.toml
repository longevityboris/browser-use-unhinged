[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-use-unhinged"
version = "0.2.0"
description = "Inspect, apply, and restore an accessibility-focused Codex browser continuation patch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[project.scripts]
browser-use-unhinged = "browser_use_unhinged.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
